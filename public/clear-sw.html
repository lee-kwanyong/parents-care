<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>부모님 케어 캐시 초기화</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7fcfb;
      color: #24423f;
    }
    .box {
      width: min(560px, calc(100% - 40px));
      background: white;
      border: 1px solid #e3f0ed;
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 16px 44px rgba(93,139,131,.12);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 30px;
      letter-spacing: -0.04em;
    }
    p {
      line-height: 1.7;
      font-weight: 800;
      color: #607d79;
    }
    a {
      display: inline-flex;
      margin-top: 16px;
      background: #19b99a;
      color: white;
      text-decoration: none;
      padding: 14px 18px;
      border-radius: 18px;
      font-weight: 900;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>캐시를 초기화했습니다.</h1>
    <p id="status">Service Worker와 브라우저 캐시를 정리하는 중입니다...</p>
    <a href="/">홈으로 돌아가기</a>
  </div>
  <script>
    async function clearAll() {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations()
          await Promise.all(registrations.map((registration) => registration.unregister()))
        }

        if ('caches' in window) {
          const keys = await caches.keys()
          await Promise.all(keys.map((key) => caches.delete(key)))
        }

        localStorage.clear()
        sessionStorage.clear()

        document.getElementById('status').textContent = '완료됐습니다. 홈으로 돌아가서 새로고침해주세요.'
      } catch (error) {
        document.getElementById('status').textContent = '일부 캐시 정리에 실패했습니다. 브라우저 새로고침을 한 번 더 해주세요.'
      }
    }

    clearAll()
  </script>
</body>
</html>
